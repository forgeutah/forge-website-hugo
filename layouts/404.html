{{ define "main" }}
  <section style="max-width: 720px; margin: 0 auto; padding: 120px 32px 140px;">
    <div class="fu-eyebrow" style="color: var(--forge-ember);">&gt; ERROR 404</div>
    <h1 class="fu-page-title" style="margin-top: 12px;">This page 404'd<span class="fu-hero-cursor">▮</span></h1>
    <p class="fu-page-lead">The path you followed isn't on the map. It happens.</p>
    <div class="fu-term" style="margin-top: 32px; max-width: 520px;">
      <div class="fu-term-bar">
        <div class="fu-term-dots"><span></span><span></span><span></span></div>
        <span class="fu-term-title">forge@clubhouse: ~</span>
      </div>
      <div class="fu-term-body">
        <div class="fu-term-line is-cmd"><span style="color: var(--accent); font-weight: 700;">$</span> cd {{ .RelPermalink }}</div>
        <div class="fu-term-line" style="color: var(--term-error);">bash: no such file or directory</div>
        <div class="fu-term-line is-cmd"><span style="color: var(--accent); font-weight: 700;">$</span> cd /</div>
        <div class="fu-term-line is-ok">[ OK ]</div>
      </div>
    </div>
    <div class="fu-hero-actions" style="margin-top: 28px;">
      <a class="fu-btn fu-btn-primary fu-btn-lg" href="{{ site.Home.RelPermalink }}">Back home</a>
      <a class="fu-btn fu-btn-secondary fu-btn-lg" href="{{ "blog/" | relLangURL }}">Read the blog <span class="fu-arrow">→</span></a>
    </div>
  </section>
{{ end }}
