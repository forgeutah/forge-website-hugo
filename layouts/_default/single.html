{{ define "main" }}
  {{ $crumb := .Params.crumb | default (.Title | lower) }}
  {{ $subtitle := .Params.subtitle | default .Params.description }}
  <header class="fu-page-header">
    <div class="fu-container">
      <div class="fu-breadcrumb">
        <a href="{{ site.Home.RelPermalink }}">home</a>
        <span>/</span>
        <span class="fu-crumb-current">{{ $crumb }}</span>
      </div>
      <h1 class="fu-page-title">{{ .Title }}</h1>
      {{ with $subtitle }}<p class="fu-page-lead">{{ . }}</p>{{ end }}
    </div>
  </header>
  <div class="fu-container-narrow fu-page-body">
    <div class="fu-prose">
      {{ .Content }}
    </div>
  </div>
{{ end }}
