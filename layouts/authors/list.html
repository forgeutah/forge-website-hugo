{{ define "main" }}
  <header class="fu-page-header">
    <div class="fu-container">
      <div class="fu-breadcrumb">
        <a href="{{ site.Home.RelPermalink }}">home</a>
        <span>/</span>
        <span class="fu-crumb-current">authors</span>
      </div>
      <h1 class="fu-page-title">{{ .Title | default "Authors" }}</h1>
    </div>
  </header>
  <div class="fu-container-narrow fu-page-body">
    <div class="fu-aside-list">
      {{ range .Pages }}<a href="{{ .RelPermalink }}"><span>{{ .Title }}</span><span>→</span></a>{{ end }}
    </div>
  </div>
{{ end }}
